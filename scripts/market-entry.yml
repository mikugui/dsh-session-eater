name: mikugui/dsh-session-eater
category: session
description:
  en: 'Session cleanup for the DSH sidebar: drag a conversation row onto the pill at the bottom of the sidebar and it opens its mouth and eats the row — the session directory goes to the Windows Recycle Bin, not to rm, so it stays restorable, and undo puts it back into its original workspace. Deletion asks one short question first (how many tokens it burned, and that prompt can be turned off in Settings). Undo from the persistent toast or the 50-entry log in Settings. Clicking the pill jumps straight to the plugin''s Settings, where you can pick between three rice-bowl avatars (plain rice / fried rice / token coins) or your own image, drag the mouth into place and rewrite all 18 UI strings; while you drag a row the avatar itself turns into the bowl you picked. When another sidebar widget squeezes it out of the row, it moves to the next line and stretches into a full-width card. Blank, currently-open and running sessions are refused in place with a reason.'
  zh: 'DSH 侧边栏的会话清理：把会话行拖到底部那条药丸嘴边，它张嘴吃掉 —— 会话目录送进 Windows 系统回收站，不是 rm，随时能撤销；撤销会把它放回原来的工作区。删除前只问一句「消耗了多少 token，真的给我吃吗？」（可在设置里关掉）；撤销走常驻回执或设置里 50 条持久台账。点侧栏那条药丸直达插件设置：三只碗形象（大白饭 / 蛋炒饭 / 金币）或自己的图、拖拽校准嘴位、改写全部 18 段界面文案；拖会话时形象本身会变成你选的那只碗。被别的侧栏挂件挤出这一行时自动挪到下一行并铺满成一张卡片。空白会话 / 正在聊的 / 正在跑的会被就地拒绝并写明原因。'
tarball: https://github.com/mikugui/dsh-session-eater/releases/latest/download/dsh-session-eater.tgz
